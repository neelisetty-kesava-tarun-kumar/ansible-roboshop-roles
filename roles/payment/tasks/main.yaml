- name: App_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app_setup.yaml

- name: Python_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: python_setup.yaml

- name: Systemd_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_setup.yaml

- name: Start and Enable Payment
  ansible.builtin.service:
    name: payment
    state: restarted
    enabled: yes