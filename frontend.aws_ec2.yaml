plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
#You will get the all IP addresses in us-east-1 region.
hostnames:
  # This option allows displaying the public ip addresses.
  #- ip-address
  #You can get the private IP address of the instances in us-east-1 region.
  - private-ip-address
filters:
  instance-state-name: running
  tag:Name: frontend-dev
compose:
  # This sets the ansible_host variable to connect with the private IP address without changing the hostname.
  ansible_host: private_ip_address
keyed_groups:
  # This creates host groups based on architecture.
  - separator: ""
    key: frontend
